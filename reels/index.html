<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCM Reels to Post</title>
<style>
:root{--bg:#0b0b0c;--card:#151517;--line:#24242a;--fg:#f4f4f5;--dim:#9a9aa2;--accent:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:22px}
video{width:100%;display:block;background:#000}
.body{padding:14px}
.id{color:var(--dim);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.cap{white-space:pre-wrap;font-size:15px;margin:0 0 10px}
.tags{color:#8ab4ff;font-size:13px;word-break:break-word;margin:0 0 12px}
.music{background:#1d1d22;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.music b{color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
a.btn,button.btn{flex:1;min-width:120px;text-align:center;text-decoration:none;border:0;border-radius:10px;
 padding:12px;font-size:14px;font-weight:600;cursor:pointer;background:#2a2a30;color:var(--fg)}
a.dl{background:var(--accent);color:#fff}
.done{opacity:.4}
.note{color:var(--dim);font-size:12px;margin-top:6px}
</style></head><body>
<h1>Reels to Post</h1><div class="sub" id="sub"></div><div id="list"></div>
<script>
const HOW = "Save the video, open Instagram, new Reel, pick the saved clip, add the suggested trending sound, paste the caption.";
fetch('reels.json?t='+Date.now()).then(r=>r.json()).then(d=>{
 document.getElementById('sub').textContent = d.reels.length+" ready. Updated "+d.updated+". "+HOW;
 const posted = JSON.parse(localStorage.getItem('posted')||'{}');
 const L=document.getElementById('list');
 d.reels.forEach(r=>{
  const c=document.createElement('div'); c.className='card'+(posted[r.id]?' done':'');
  c.innerHTML=`<video src="${r.video}" poster="${r.poster}" controls preload="none" playsinline></video>
   <div class="body"><div class="id">${r.id}${posted[r.id]?' &middot; posted':''}</div>
   <p class="cap">${r.caption.replace(/</g,'&lt;')}</p>
   <p class="tags">${r.hashtags}</p>
   <div class="music">🎵 <b>Music:</b> ${r.music}. In the Reels audio picker search <b>trending</b> and pick a sound with the ↑ arrow (15 to 25 sec).</div>
   <div class="row">
     <a class="btn dl" href="${r.video}" download>Download video</a>
     <button class="btn" onclick="cp(\`${r.caption.replace(/`/g,'\\`')}\n\n${r.hashtags}\`,this)">Copy caption</button>
   </div>
   <div class="row" style="margin-top:8px"><button class="btn" onclick="mark('${r.id}',this)">Mark posted</button></div>
   <div class="note">Tip: tap the video, share, Save to Photos.</div></div>`;
  L.appendChild(c);
 });
});
function cp(t,b){navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy caption',1200)})}
function mark(id,b){const p=JSON.parse(localStorage.getItem('posted')||'{}');p[id]=1;localStorage.setItem('posted',JSON.stringify(p));b.closest('.card').classList.add('done');b.textContent='Posted'}
</script></body></html>
